<!DOCTYPE html>
<html>
<head>
    <title>Safe Campus Map</title>


    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }


        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>


<body>


<div id="map"></div>


<script>
function initMap() {


    const params = new URLSearchParams(window.location.search);


    const latitude = parseFloat(params.get("lat")) || 24.8607;
    const longitude = parseFloat(params.get("lng")) || 67.0011;


    const location = {
        lat: latitude,
        lng: longitude
    };


    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 15,
            center: location
        }
    );


    new google.maps.Marker({
        position: location,
        map: map,
        title: "Student Location"
    });
}
</script>


<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVh1JrlGijggiGmPwOuw_dUwGk7yyRPDg&callback=initMap"
    async
    defer>
</script>


</body>
</html>
