<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Safe Campus | Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo"><img src="{{ url_for('static', filename='assets/safe-campus-logo.png') }}" alt="Safe Campus"></div>
    <h1>Create Account</h1>
    <p>Join Safe Campus</p>
    <form id="registerForm">
      <input id="name" placeholder="Full Name" autocomplete="name" required>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="phone" placeholder="Phone Number" autocomplete="tel" required>
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" required>
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="Student">Student</option>
        <option value="Security">Security</option>
        <option value="Admin">Admin</option>
      </select>
      <div id="message"></div>
      <button type="submit">Register</button>
    </form>
    <a class="back" href="{{ url_for('login_page') }}">Back to Login</a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
