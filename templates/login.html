<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Safe Campus | Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <h1>SAFE CAMPUS</h1>
    <p class="welcome">Welcome Back!</p>
    <div class="logo-circle">
      <img src="{{ url_for('static', filename='assets/safe-campus-logo.png') }}" alt="Safe Campus">
    </div>
    <form id="loginForm">
      <div class="input-box">
        <i class="fa-regular fa-user"></i>
        <input id="email" type="text" placeholder="Email / Username" autocomplete="username" required>
      </div>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="eye" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
      </div>
      <div class="forgot"><a href="#" id="forgot">Forgot Password?</a></div>
      <div id="message" class="message"></div>
      <button class="login-btn" type="submit">Login</button>
    </form>
    <p class="signup">Don't have an account? <a href="{{ url_for('register_page') }}">Sign Up</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
